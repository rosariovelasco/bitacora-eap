<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bitácora EAP</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%97%82%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#F6F3EC; --surface:#FFFFFF; --surface-2:#FBF8F2;
    --ink:#212C27; --ink-muted:#5E6D64; --ink-faint:#93A099;
    --line:#E2DCCC; --line-soft:#EAE4D5;
    --accent:#3F6B5C; --accent-strong:#2A4E42; --accent-soft:#E4EEE9; --accent-ink:#1D3A31;
    --warn:#9A6B24; --warn-soft:#F6ECD9;
    --critical:#AE4437; --critical-soft:#F7E7E3;
    --shadow:0 1px 2px rgba(33,44,39,.06),0 6px 20px -10px rgba(33,44,39,.18);
    --radius-s:8px; --radius-m:14px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#121712; --surface:#1A211C; --surface-2:#202822;
      --ink:#EBE7DC; --ink-muted:#A7B3A9; --ink-faint:#6D786F;
      --line:#2C352E; --line-soft:#242D27;
      --accent:#7FB39B; --accent-strong:#9FCBB6; --accent-soft:#213229; --accent-ink:#BFE3D2;
      --warn:#E0B36C; --warn-soft:#332812;
      --critical:#E3897C; --critical-soft:#3A211E;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px -12px rgba(0,0,0,.55);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:'Work Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent;min-height:100vh;}
  h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:600;letter-spacing:-.01em;text-wrap:balance;margin:0;}
  .mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;}
  button,input,select,textarea{font-family:inherit;color:inherit;}
  ::selection{background:var(--accent-soft);}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  #app{min-height:100vh;padding-bottom:48px;}

  .topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);}
  .topbar-inner{max-width:980px;margin:0 auto;padding:14px 16px 12px;display:flex;align-items:center;gap:10px;}
  .mark{width:34px;height:34px;flex-shrink:0;border-radius:9px;background:var(--accent);color:var(--surface);display:flex;align-items:center;justify-content:center;}
  .mark svg{width:19px;height:19px;}
  .brand{flex:1;min-width:0;}
  .brand h1{font-size:1.15rem;line-height:1.15;}
  .brand .sub{font-size:.74rem;color:var(--ink-muted);margin-top:1px;}
  .identity-chip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 12px;font-size:.8rem;white-space:nowrap;}
  .identity-chip .who{font-weight:600;max-width:160px;overflow:hidden;text-overflow:ellipsis;}
  .identity-chip button{border:none;background:var(--surface-2);color:var(--ink-muted);border-radius:999px;padding:5px 10px;font-size:.74rem;cursor:pointer;font-weight:500;}
  .identity-chip button:hover{color:var(--ink);}

  .tabs{max-width:980px;margin:0 auto;padding:0 16px 12px;display:flex;gap:6px;flex-wrap:wrap;}
  .tab-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink-muted);border-radius:999px;padding:8px 14px;font-size:.85rem;font-weight:600;cursor:pointer;}
  .tab-btn.active{background:var(--accent);border-color:var(--accent);color:var(--surface);}
  .tab-btn:hover:not(.active){border-color:var(--accent);color:var(--ink);}

  .wrap{max-width:980px;margin:0 auto;padding:6px 16px 40px;}
  .wrap.narrow{max-width:640px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:16px;box-shadow:var(--shadow);}
  .stack{display:flex;flex-direction:column;gap:12px;}
  .section-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-faint);font-weight:600;margin:20px 2px 8px;}
  .section-label:first-child{margin-top:4px;}

  label{display:block;font-size:.8rem;font-weight:600;color:var(--ink-muted);margin:12px 0 5px;}
  label:first-child{margin-top:0;}
  input[type="text"],input[type="date"],input[type="time"],input[type="month"],input[type="number"],input[type="password"],select{
    width:100%;padding:11px 12px;border-radius:var(--radius-s);border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-size:.95rem;}
  select:disabled{opacity:.55;}
  input:focus,select:focus{border-color:var(--accent);}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .field-row.cols-3{grid-template-columns:repeat(3,1fr);}
  .field-row.cols-5{grid-template-columns:repeat(5,1fr);}
  @media (max-width:700px){.field-row.cols-3,.field-row.cols-5{grid-template-columns:1fr 1fr;}}
  .hint{font-size:.74rem;color:var(--ink-faint);margin-top:4px;line-height:1.45;}

  .btn{border:none;border-radius:var(--radius-s);padding:11px 16px;font-size:.9rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
  .btn-primary{background:var(--accent);color:var(--surface);width:100%;}
  .btn-primary:hover{background:var(--accent-strong);}
  .btn-primary:disabled{background:var(--ink-faint);}
  .btn-secondary{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);}
  .btn-secondary:hover{border-color:var(--accent);}
  .btn-ghost{background:transparent;color:var(--ink-muted);padding:6px 10px;font-size:.82rem;}
  .btn-ghost:hover{color:var(--ink);}
  .btn-danger{background:transparent;color:var(--critical);border:1px solid var(--critical-soft);padding:6px 10px;font-size:.78rem;}
  .btn-danger:hover{background:var(--critical-soft);}
  .btn-danger-solid{background:var(--critical);color:#fff;}
  .btn-row{display:flex;gap:8px;margin-top:14px;}
  .btn-row .btn{flex:1;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  .empty{text-align:center;color:var(--ink-muted);padding:36px 18px;font-size:.9rem;line-height:1.6;}
  .empty .big{font-size:1.6rem;display:block;margin-bottom:6px;}

  .gate{max-width:440px;margin:0 auto;padding:56px 20px 60px;}
  .gate-head{text-align:center;margin-bottom:26px;}
  .logo-gate{display:block;height:48px;width:auto;margin:0 auto 20px;}
  .logo-top{height:26px;width:auto;flex-shrink:0;}
  .logo-hoja{display:block;height:34px;width:auto;margin-bottom:16px;}
  @media (max-width:520px){.logo-top{height:20px;}.brand .sub{display:none;}}
  .gate-head h1{font-size:1.55rem;margin-bottom:6px;}
  .gate-head p{color:var(--ink-muted);font-size:.92rem;margin:0;line-height:1.5;}
  .admin-msg{margin-top:14px;padding:12px 14px;border-radius:var(--radius-s);font-size:.85rem;line-height:1.5;background:var(--critical-soft);color:var(--critical);}
  .demo-banner{background:var(--warn-soft);color:var(--warn);text-align:center;font-size:.8rem;padding:7px 10px;font-weight:600;}

  .visita{border:1px solid var(--line);border-radius:var(--radius-m);padding:12px 14px;background:var(--surface);}
  .visita + .visita{margin-top:8px;}
  .visita-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .visita-fecha{font-family:'IBM Plex Mono',monospace;font-size:.8rem;color:var(--ink-muted);}
  .visita-paciente{font-weight:600;font-size:.96rem;margin-top:3px;}
  .visita-meta{font-size:.82rem;color:var(--ink-muted);margin-top:2px;}
  .visita-psico{display:inline-block;background:var(--accent-soft);color:var(--accent-ink);border-radius:999px;padding:2px 9px;font-size:.72rem;font-weight:600;margin-top:6px;}
  .visita-actions{display:flex;gap:6px;flex-shrink:0;}

  .filtros{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-m);padding:14px;margin-bottom:14px;}
  .filtros-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;flex-wrap:wrap;gap:8px;}
  .count-tag{font-size:.78rem;color:var(--ink-muted);}

  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--accent-strong);color:var(--surface);padding:11px 18px;border-radius:999px;font-size:.86rem;font-weight:600;box-shadow:var(--shadow);z-index:100;}
  .toast.toast-error{background:var(--critical);color:#fff;display:flex;align-items:center;gap:10px;}
  .toast-close{border:none;background:transparent;color:inherit;font-size:1.1rem;line-height:1;cursor:pointer;padding:0 2px;}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
  .modal-box{background:var(--surface);border-radius:var(--radius-m);padding:20px;max-width:380px;width:100%;box-shadow:var(--shadow);}
  .modal-msg{font-size:.92rem;line-height:1.55;margin:0;}

  .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-m);background:var(--surface);}
  table{width:100%;border-collapse:collapse;font-size:.88rem;min-width:640px;}
  thead th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:600;}
  tbody td{padding:11px 14px;border-bottom:1px solid var(--line-soft);white-space:nowrap;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--surface-2);}
  td.num,th.num{text-align:right;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
  tfoot td{padding:12px 14px;font-weight:700;border-top:2px solid var(--line);font-family:'IBM Plex Mono',monospace;}
  tfoot td.label{font-family:'Work Sans',sans-serif;}

  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
  @media (max-width:560px){.stat-row{grid-template-columns:1fr;}}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:14px 16px;box-shadow:var(--shadow);}
  .stat .lbl{font-size:.74rem;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;}
  .stat .val{font-family:'Fraunces',serif;font-size:1.5rem;font-weight:600;margin-top:4px;}
  .stat.accent{background:var(--accent-soft);border-color:var(--accent-soft);}
  .stat.accent .val{color:var(--accent-ink);}

  .list-row{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:var(--radius-m);padding:12px 14px;background:var(--surface);flex-wrap:wrap;}
  .list-row .info{flex:1;min-width:180px;}
  .list-row .nombre{font-weight:600;font-size:.95rem;}
  .list-row .tel{font-size:.78rem;color:var(--ink-faint);margin-top:1px;}
  .list-row.inactivo{opacity:.55;}
  .sub-panel{border:1px solid var(--line);border-radius:var(--radius-m);padding:14px;background:var(--surface);margin-top:-4px;}
  .switch{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;color:var(--ink-muted);cursor:pointer;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:5px 10px;}
  .switch input{width:auto;}
  .psico-link{background:none;border:none;padding:0;font:inherit;color:var(--ink);font-weight:600;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;}
  .psico-link:hover{color:var(--accent-strong);}
  .notice{background:var(--warn-soft);color:var(--warn);border-radius:var(--radius-s);padding:12px 14px;font-size:.85rem;line-height:1.5;margin-bottom:14px;}
  .notice.info{background:var(--accent-soft);color:var(--accent-ink);}

  /* Reporte para el profesional (siempre claro, pensado para imprimir) */
  .hoja{max-width:800px;margin:0 auto;background:#fff;color:#1c1f1d;border:1px solid var(--line);border-radius:var(--radius-m);padding:36px 40px;box-shadow:var(--shadow);}
  .hoja h2{font-size:1.5rem;color:#1c1f1d;}
  .hoja .emisor{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:#5b645f;font-weight:600;margin-bottom:6px;}
  .hoja .meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;margin:20px 0 22px;font-size:.9rem;}
  .hoja .meta b{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:#6b746f;font-weight:600;margin-bottom:1px;}
  .hoja table{min-width:0;font-size:.84rem;color:#1c1f1d;}
  .hoja thead th{color:#5b645f;border-bottom:1px solid #cfd4d0;padding:8px 8px;}
  .hoja tbody td{padding:7px 8px;border-bottom:1px solid #e6e9e6;white-space:normal;}
  .hoja tbody tr:hover{background:transparent;}
  .hoja .totales{margin:22px 0 0 auto;max-width:440px;font-size:.92rem;}
  .hoja .totales span{white-space:nowrap;}
  .hoja .totales span:first-child{white-space:normal;padding-right:14px;}
  .hoja .totales div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #e6e9e6;}
  .hoja .totales div.fuerte{font-weight:700;font-size:1rem;border-bottom:2px solid #1c1f1d;}
  .hoja .nota{margin-top:20px;font-size:.78rem;color:#5b645f;line-height:1.5;}
  .hoja .aviso{margin-top:14px;padding:10px 12px;background:#fbf1dd;color:#7a5a1d;font-size:.82rem;border-radius:6px;}
  @media (max-width:700px){.hoja{padding:22px 16px;}.hoja .meta{grid-template-columns:1fr;}}
  @media print{
    @page{size:A4;margin:16mm;}
    html,body{background:#fff !important;}
    .topbar,.tabs,.no-print,.toast,.demo-banner{display:none !important;}
    .wrap{padding:0 !important;max-width:none !important;}
    .hoja{border:none;box-shadow:none;padding:0;max-width:none;border-radius:0;}
    .table-wrap{border:none;overflow:visible;}
  }
</style>
</head>

function toRow(tabla, obj){
  var cols = TABLAS[tabla].cols, row = {};
  Object.keys(cols).forEach(function(k){ if(obj[k] !== undefined) row[cols[k]] = obj[k]; });
  return row;
}
function fromRow(tabla, row){
  var cols = TABLAS[tabla].cols, o = { id: row.id };
  Object.keys(cols).forEach(function(k){
    var v = row[cols[k]];
    if(k === 'activo') o[k] = v !== false;
    else if(k === 'tarifa') o[k] = Number(v) || 0;
    else o[k] = (v === null || v === undefined) ? '' : v;
  });
  return o;
}

// ---------- Utilidades ----------
function esc(s){
  return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function pad(n){ return String(n).padStart(2,'0'); }
function hoyLocal(){ var d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function horaAhora(){ var d = new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function mesActual(){ var d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1); }
function fmtFecha(f){ if(!f) return '—'; var p = f.split('-'); return p.length===3 ? p[2]+'/'+p[1]+'/'+p[0] : f; }
function mesLabel(m){ if(!m) return ''; var p = m.split('-'); return (MESES[Number(p[1])-1]||'') + ' ' + p[0]; }
function fmtMoneda(n, moneda){ return (moneda||'$') + ' ' + Math.round(n||0).toLocaleString('es-CL'); }
function fmtNumeroCL(n){ return (Number(n)||0).toLocaleString('es-CL', {maximumFractionDigits:2}); }
function parseNumeroCL(s){
  if(s === null || s === undefined || s === '') return 0;
  var n = parseFloat(String(s).trim().replace(/\./g,'').replace(',','.'));
  return isNaN(n) ? 0 : n;
}
function csvCell(v){
  var s = String(v === null || v === undefined ? '' : v);
  return /[",;\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function csvDe(filas){ return '﻿' + filas.map(function(r){ return r.map(csvCell).join(';'); }).join('\r\n'); }
function descargar(nombre, texto){
  var url = URL.createObjectURL(new Blob([texto], { type:'text/csv;charset=utf-8' }));
  var a = document.createElement('a');
  a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
}
function ordenNombre(a, b){ return (a.nombre||'').localeCompare(b.nombre||'', 'es'); }
function activosDe(lista){ return lista.filter(function(x){ return x.activo !== false; }).sort(ordenNombre); }
function todosDe(lista){ return lista.slice().sort(ordenNombre); }
function porId(lista, id){ for(var i=0;i<lista.length;i++){ if(lista[i].id===id) return lista[i]; } return null; }

function psicoById(id){ return porId(state.psicologos, id); }
function empresaById(id){ return porId(state.empresas, id); }
function pacienteById(id){ return porId(state.pacientes, id); }
function nombrePsico(a){ var p = psicoById(a.psicologoId); return p ? p.nombre : (a.psicologoNombre || '(profesional eliminado)'); }
function nombreEmpresaRef(o){ var e = empresaById(o.empresaId); return e ? e.nombre : (o.empresaNombre || '(empresa eliminada)'); }
function nombrePacienteRef(a){ var p = pacienteById(a.pacienteId); return p ? p.nombre : (a.pacienteNombre || '(paciente eliminado)'); }
function pacientesDeEmpresa(empresaId, soloActivos){
  return state.pacientes.filter(function(p){ return p.empresaId === empresaId && (!soloActivos || p.activo !== false); }).sort(ordenNombre);
}

// ---------- Tarifas ----------
function historialTarifas(psicologoId){
  return state.tarifasHistorial.filter(function(t){ return t.psicologoId === psicologoId; })
    .sort(function(a,b){ return b.vigenteDesde.localeCompare(a.vigenteDesde); });
}
function tarifaActual(psicologoId){ var h = historialTarifas(psicologoId); return h.length ? h[0] : null; }
function tarifaVigenteEn(psicologoId, fecha){
  var c = state.tarifasHistorial.filter(function(t){ return t.psicologoId === psicologoId && t.vigenteDesde <= fecha; });
  if(!c.length) return null;
  c.sort(function(a,b){ return b.vigenteDesde.localeCompare(a.vigenteDesde); });
  return c[0];
}
function valorTarifaPesos(t){ if(!t) return 0; return t.tipo === 'uf' ? t.tarifa * (state.config.valorUF||0) : t.tarifa; }
function textoTarifa(t, moneda){
  if(!t) return 'Sin tarifa';
  return t.tipo === 'uf' ? fmtNumeroCL(t.tarifa) + ' UF' : fmtMoneda(t.tarifa, moneda);
}

// ---------- Cálculos mensuales ----------
function itemsPsicologo(psicologoId, mes){
  return state.atenciones
    .filter(function(a){ return a.psicologoId === psicologoId && a.fecha.slice(0,7) === mes; })
    .sort(function(a,b){ return (a.fecha+a.hora).localeCompare(b.fecha+b.hora); })
    .map(function(a){ var t = tarifaVigenteEn(psicologoId, a.fecha); return { a:a, t:t, valor: Math.round(valorTarifaPesos(t)) }; });
}
function resumenPsicologo(p, mes){
  var items = itemsPsicologo(p.id, mes);
  var bruto = items.reduce(function(s,i){ return s + i.valor; }, 0);
  var pct = state.config.retencionPct || 0;
  var retencion = Math.round(bruto * pct / 100);
  var usadas = {};
  items.forEach(function(i){ if(i.t) usadas[i.t.tipo + ':' + i.t.tarifa] = true; });
  return {
    p:p, items:items, cantidad:items.length, bruto:bruto, retPct:pct, retencion:retencion, liquido:bruto - retencion,
    faltaTarifa: items.some(function(i){ return !i.t; }),
    variasTarifas: Object.keys(usadas).length > 1,
    tarifaRepr: tarifaVigenteEn(p.id, mes + '-31')
  };
}
function filasLiquidacion(mes){

function crearBackendSupabase(){
  var sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, { auth: { persistSession:true, autoRefreshToken:true } });
  function chk(r){ if(r.error) throw r.error; return r.data; }
  return {
    sb: sb,
    cargar: async function(tabla){
      var out = [], desde = 0, paso = 1000;
      while(true){
        var data = chk(await sb.from(tabla).select('*').order('creado_en',{ascending:true}).order('id',{ascending:true}).range(desde, desde+paso-1));
        data.forEach(function(r){ out.push(fromRow(tabla, r)); });
        if(data.length < paso) break;
        desde += paso;
      }
      return out;
    },
    agregar: async function(tabla, obj){ return fromRow(tabla, chk(await sb.from(tabla).insert(toRow(tabla,obj)).select().single())); },
    actualizar: async function(tabla, id, patch){ chk(await sb.from(tabla).update(toRow(tabla,patch)).eq('id',id)); },
    eliminar: async function(tabla, id){ chk(await sb.from(tabla).delete().eq('id',id)); },
    cargarConfig: async function(){
      var r = chk(await sb.from('config').select('*').eq('id','general').maybeSingle());
      return r ? { retencionPct:Number(r.retencion_pct)||0, moneda:r.moneda||'$', valorUF:Number(r.valor_uf)||0, emisor:r.emisor||'' } : null;
    },
    guardarConfig: async function(c){
      chk(await sb.from('config').update({ retencion_pct:c.retencionPct, moneda:c.moneda, valor_uf:c.valorUF, emisor:c.emisor }).eq('id','general'));
    }
  };
}

async function recargar(tabla){
  state[TABLAS[tabla].estado] = await state.backend.cargar(tabla);
  rerender();
}
async function recargarConfig(){
  var c = await state.backend.cargarConfig();
  if(c) state.config = c;
  rerender();
}
async function cargarTodo(){
  var tablas = Object.keys(TABLAS);
  var res = await Promise.all(tablas.map(function(t){ return state.backend.cargar(t); }));
  tablas.forEach(function(t, i){ state[TABLAS[t].estado] = res[i]; });
  var c = await state.backend.cargarConfig();
  if(c) state.config = c;
  state.datosListos = true;
  rerender();
}
var recargaPendiente = {};
function programarRecarga(tabla){
  clearTimeout(recargaPendiente[tabla]);
  recargaPendiente[tabla] = setTimeout(function(){
    (tabla === 'config' ? recargarConfig() : (TABLAS[tabla] ? recargar(tabla) : Promise.resolve())).catch(function(e){ console.error(e); });
  }, 350);
}
var escuchando = false;
function escucharCambios(){
  var sb = state.backend.sb;
  if(!sb || escuchando) return;
  escuchando = true;
  sb.channel('cambios')
    .on('postgres_changes', { event:'*', schema:'public' }, function(p){ programarRecarga(p.table); })
    .subscribe();
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden && state.session){ cargarTodo().catch(function(e){ console.error(e); }); }
  });
}

async function conError(fn, prefijo){
  try{ return await fn(); }
  catch(e){ mostrarError((prefijo || 'No se pudo completar') + ': ' + ((e && e.message) || 'error desconocido')); return undefined; }
}

// ---------- Arranque / sesión ----------
async function iniciar(){
  if(DEMO){
    state.backend = crearBackendDemo();
    state.session = { user: { email:'demo' } };
    state.authListo = true;
    await cargarTodo();
    return;
  }
  if(!CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY || !window.supabase){ state.authListo = true; rerender(); return; }
  state.backend = crearBackendSupabase();
  var sb = state.backend.sb;
  var r = await sb.auth.getSession();
  state.session = r.data.session;
  state.authListo = true;
  if(state.session){ rerender(); await cargarTodo().catch(function(e){ mostrarError('No se pudieron cargar los datos: ' + e.message); }); escucharCambios(); }
  else rerender();
  sb.auth.onAuthStateChange(function(ev, sess){
    var tenia = !!state.session;
    state.session = sess;
    setTimeout(function(){
      if(sess && !tenia){ cargarTodo().catch(function(e){ mostrarError('No se pudieron cargar los datos: ' + e.message); }); escucharCambios(); }
      if(!sess){ state.datosListos = false; rerender(); }
    }, 0);
  });
}
async function onLogin(){
  var l = state.login;
  var elE = document.getElementById('lg-email'), elP = document.getElementById('lg-pass');
  if(elE) l.email = elE.value;
  if(elP) l.password = elP.value;
  l.error = ''; l.cargando = true; rerender();
  var r = await state.backend.sb.auth.signInWithPassword({ email: l.email.trim(), password: l.password });
  l.cargando = false;
  if(r.error){ l.error = 'Correo o contraseña incorrectos.'; rerender(); return; }
  l.password = '';
  state.session = r.data.session;
  rerender();
  await cargarTodo().catch(function(e){ mostrarError('No se pudieron cargar los datos: ' + e.message); });
  escucharCambios();
}
async function onSalir(){
  if(DEMO){ return; }
  await state.backend.sb.auth.signOut();
  state.session = null; state.datosListos = false;
  rerender();
}

function rerender(){
  var activo = document.activeElement;
  var activeId = activo && activo.id ? activo.id : null;
  var ss = null, se = null;
  if(activo && 'selectionStart' in activo){ try{ ss = activo.selectionStart; se = activo.selectionEnd; }catch(e){} }
  var y = window.scrollY;
  root.innerHTML = renderApp() + renderErrorBanner() + renderConfirmModal();
  if(activeId){
    var el = document.getElementById(activeId);
    if(el){
      el.focus({ preventScroll:true });
      if(ss !== null && el.setSelectionRange){ try{ el.setSelectionRange(ss, se); }catch(e){} }
    }
  }
  if(window.scrollY !== y) window.scrollTo(0, y);
}

    : fmtMoneda(r.tarifaRepr.tarifa, moneda);

function csvReporte(){
  var p = psicoById(state.reporte.psicologoId); if(!p) return;
  var r = resumenPsicologo(p, state.mes);
  var head = ['Fecha','Hora','Empresa'].concat(state.incluirPacientes ? ['Paciente'] : []).concat(['Tarifa','Valor (pesos)']);
  var rows = r.items.map(function(i){
    return [fmtFecha(i.a.fecha), i.a.hora, nombreEmpresaRef(i.a)].concat(state.incluirPacientes ? [nombrePacienteRef(i.a)] : []).concat([i.t ? textoTarifa(i.t, state.config.moneda) : 'SIN TARIFA', i.valor]);
  });
  var pad = state.incluirPacientes ? 4 : 3;
  function fila(etq, val){ var f = []; for(var k=0;k<pad;k++) f.push(''); f.push(etq); f.push(val); return f; }
  rows.push(fila('Monto bruto', r.bruto), fila('Retención ' + r.retPct + '%', r.retencion), fila('Líquido', r.liquido));
  descargar('reporte_' + nombreArchivo(p.nombre) + '_' + state.mes + '.csv', csvDe([head].concat(rows)));
}

// ---------- Atenciones ----------
function atencionesFiltradas(){
  var f = state.filtros;
  var q = f.paciente.trim().toLowerCase();
  return state.atenciones.filter(function(a){
    if(f.psicologoId && a.psicologoId !== f.psicologoId) return false;
    if(f.empresaId && a.empresaId !== f.empresaId) return false;
    if(f.mes && a.fecha.slice(0,7) !== f.mes) return false;
    if(f.desde && a.fecha < f.desde) return false;
    if(f.hasta && a.fecha > f.hasta) return false;
    if(q && nombrePacienteRef(a).toLowerCase().indexOf(q) === -1) return false;
    return true;
  }).sort(function(a,b){ return (b.fecha+b.hora).localeCompare(a.fecha+a.hora); });
}

// ---------- Empresas ----------
function renderEmpresas(){
  var ne = state.formNuevaEmpresa;
  var alta = '<div class="card" style="margin-bottom:16px;"><form data-action="agregar-empresa"><div class="section-label" style="margin-top:0;">Agregar empresa</div>' +
    '<label for="ne-nombre">Nombre de la empresa</label><input type="text" id="ne-nombre" data-form="formNuevaEmpresa" data-field="nombre" value="'+esc(ne.nombre)+'" required>' +
    '<div class="btn-row"><button type="submit" class="btn btn-primary">Agregar</button></div></form></div>';
  var lista = todosDe(state.empresas);
  var cuerpo = lista.length === 0 ? '<div class="empty"><span class="big">🏢</span>Aún no has agregado empresas.</div>' : lista.map(function(e){
    var n = pacientesDeEmpresa(e.id, false).length;
    var fila = '<div class="list-row'+(e.activo===false?' inactivo':'')+'"><div class="info"><div class="nombre">'+esc(e.nombre)+'</div><div class="tel">'+n+' paciente'+(n===1?'':'s')+'</div></div>' +
      '<button class="btn btn-secondary" data-action="editar-empresa" data-id="'+e.id+'" type="button">Editar</button>' +
      '<label class="switch"><input type="checkbox" data-action="toggle-activo" data-tabla="empresas" data-id="'+e.id+'" '+(e.activo!==false?'checked':'')+'>Activa</label>' +
      '<button class="btn btn-danger" data-action="eliminar-empresa" data-id="'+e.id+'" type="button">Eliminar</button></div>';
    var panel = state.editandoEmpresaId === e.id
      ? '<div class="sub-panel"><form data-action="guardar-empresa" data-id="'+e.id+'"><label for="ee-nombre">Nombre</label><input type="text" id="ee-nombre" data-form="formEmpresa" data-field="nombre" value="'+esc(state.formEmpresa.nombre)+'" required>' +
        '<div class="btn-row"><button type="button" class="btn btn-secondary" data-action="cancelar-empresa">Cancelar</button><button type="submit" class="btn btn-primary">Guardar</button></div></form></div>' : '';
    return '<div class="stack" style="gap:8px;">' + fila + panel + '</div>';
  }).join('');
  return '<div class="wrap narrow">' + alta + '<div class="stack">' + cuerpo + '</div></div>';
}

}

// ---------- Pacientes ----------
function renderPacientes(){
  var empresas = todosDe(state.empresas), filtroId = state.pacientesFiltroEmpresaId;
  if(!empresas.length) return '<div class="wrap narrow"><div class="empty"><span class="big">🏢</span>Primero agrega al menos una empresa en la pestaña Empresas.</div></div>';
  var npac = state.formNuevoPaciente;
  var lista = (filtroId ? pacientesDeEmpresa(filtroId, false) : todosDe(state.pacientes));
  var alta = '<div class="card" style="margin-bottom:16px;"><form data-action="agregar-paciente"><div class="section-label" style="margin-top:0;">Agregar paciente</div>' +
    '<div class="field-row" style="margin-top:0;"><div><label for="npac-emp">Empresa</label><select id="npac-emp" data-form="formNuevoPaciente" data-field="empresaId" required>'+opcionesSelect(empresas, npac.empresaId, 'Selecciona una empresa')+'</select></div>' +
    '<div><label for="npac-nombre">Nombre del paciente</label><input type="text" id="npac-nombre" data-form="formNuevoPaciente" data-field="nombre" value="'+esc(npac.nombre)+'" required></div></div>' +
    '<div class="btn-row"><button type="submit" class="btn btn-primary">Agregar</button></div></form></div>';
  var filtro = '<div class="filtros"><label for="pf-emp">Filtrar por empresa</label><select id="pf-emp" data-action="filtro-pacientes">'+opcionesSelect(empresas, filtroId, 'Todas las empresas')+'</select>' +
    '<div class="filtros-foot"><span class="count-tag">'+lista.length+' paciente'+(lista.length===1?'':'s')+'</span></div></div>';
  var cuerpo = lista.length === 0 ? '<div class="empty"><span class="big">🧑</span>No hay pacientes con este filtro.</div>' : lista.slice(0, 300).map(function(p){
    var fila = '<div class="list-row'+(p.activo===false?' inactivo':'')+'"><div class="info"><div class="nombre">'+esc(p.nombre)+'</div><div class="tel">'+esc(nombreEmpresaRef(p))+'</div></div>' +
      '<button class="btn btn-secondary" data-action="editar-paciente" data-id="'+p.id+'" type="button">Editar</button>' +
      '<label class="switch"><input type="checkbox" data-action="toggle-activo" data-tabla="pacientes" data-id="'+p.id+'" '+(p.activo!==false?'checked':'')+'>Activo</label>' +
      '<button class="btn btn-danger" data-action="eliminar-paciente" data-id="'+p.id+'" type="button">Eliminar</button></div>';
    var panel = state.editandoPacienteId === p.id
      ? '<div class="sub-panel"><form data-action="guardar-paciente" data-id="'+p.id+'"><div class="field-row" style="margin-top:0;"><div><label for="ep2-nombre">Nombre</label><input type="text" id="ep2-nombre" data-form="formPaciente" data-field="nombre" value="'+esc(state.formPaciente.nombre)+'" required></div>' +
        '<div><label for="ep2-emp">Empresa</label><select id="ep2-emp" data-form="formPaciente" data-field="empresaId" required>'+opcionesSelect(empresas, state.formPaciente.empresaId, 'Selecciona')+'</select></div></div>' +
        '<div class="btn-row"><button type="button" class="btn btn-secondary" data-action="cancelar-paciente">Cancelar</button><button type="submit" class="btn btn-primary">Guardar</button></div></form></div>' : '';
    return '<div class="stack" style="gap:8px;">' + fila + panel + '</div>';
  }).join('') + (lista.length > 300 ? '<div class="hint" style="text-align:center;margin-top:10px;">Se muestran los primeros 300. Usa el filtro por empresa para ver el resto.</div>' : '');
  return '<div class="wrap narrow">' + alta + filtro + '<div class="stack">' + cuerpo + '</div></div>';
}

// ---------- Configuración ----------
function renderConfig(){
  var cf = state.formConfig;
  return '<div class="wrap narrow"><div class="card"><form data-action="guardar-config">' +
    '<label for="cfg-ret">Retención de boletas de honorarios (%)</label><input type="text" inputmode="decimal" id="cfg-ret" data-form="formConfig" data-field="retencionPct" value="'+esc(cf.retencionPct)+'">' +
    '<div class="hint">Porcentaje que se descuenta del bruto para calcular el líquido. Se puede escribir con coma (ej: 15,25).</div>' +
    '<label for="cfg-uf">Valor UF (en pesos)</label><input type="text" inputmode="decimal" id="cfg-uf" data-form="formConfig" data-field="valorUF" value="'+esc(cf.valorUF)+'" placeholder="0">' +
    '<div class="hint">Convierte a pesos las tarifas pactadas en UF. También se puede actualizar desde la pestaña Liquidación.</div>' +
    '<label for="cfg-emisor">Nombre que aparece en los reportes (opcional)</label><input type="text" id="cfg-emisor" data-form="formConfig" data-field="emisor" value="'+esc(cf.emisor)+'" placeholder="Ej: Wellive · Programa EAP">' +
    '<label for="cfg-moneda">Símbolo de moneda</label><input type="text" id="cfg-moneda" data-form="formConfig" data-field="moneda" value="'+esc(cf.moneda)+'" placeholder="$">' +
    '<div class="btn-row"><button type="submit" class="btn btn-primary">Guardar configuración</button></div></form></div></div>';
}
async function guardarConfigObj(c, msg){
  var ok = await conError(async function(){ await state.backend.guardarConfig(c); await recargarConfig(); return true; }, 'No se pudo guardar');
  if(ok) mostrarToast(msg);
  return ok;
}
async function onGuardarConfig(){
  var cf = state.formConfig;
  await guardarConfigObj({ retencionPct:parseNumeroCL(cf.retencionPct), moneda:cf.moneda.trim() || '$', valorUF:parseNumeroCL(cf.valorUF), emisor:cf.emisor.trim() }, 'Configuración guardada');
}
async function onTraerUF(){
  try{
    var ctrl = new AbortController(), to = setTimeout(function(){ ctrl.abort(); }, 10000);
    var r = await fetch('https://mindicador.cl/api/uf', { signal: ctrl.signal });
    clearTimeout(to);
    var j = await r.json(), v = j && j.serie && j.serie[0] && j.serie[0].valor;
    if(!v) throw new Error('sin dato');
    var c = Object.assign({}, state.config, { valorUF: v });
    await guardarConfigObj(c, 'UF actualizada: ' + fmtMoneda(v, state.config.moneda));
  }catch(e){
    mostrarError('No se pudo traer la UF automáticamente. Escríbela a mano (la encuentras en bcentral.cl).');
  }
}
async function onActualizarValorUF(val){
  await guardarConfigObj(Object.assign({}, state.config, { valorUF: parseNumeroCL(val) }), 'Valor UF actualizado');
}

// ---------- Eliminación con confirmación ----------
async function onConfirmarEliminar(){
  var c = state.confirmDialog;
  if(!c) return;
  state.confirmDialog = null;
  var tabla = { atencion:'atenciones', psicologo:'psicologos', empresa:'empresas', paciente:'pacientes', tarifa:'tarifas' }[c.tipo];
  if(!tabla){ rerender(); return; }
  var ok = await conError(async function(){
    await state.backend.eliminar(tabla, c.id);
    if(c.tipo === 'psicologo'){
      var tars = state.tarifasHistorial.filter(function(t){ return t.psicologoId === c.id; });
      await Promise.all(tars.map(function(t){ return state.backend.eliminar('tarifas', t.id); }));
      await recargar('tarifas');
    }
    await recargar(tabla);
    return true;
  }, 'No se pudo eliminar');
  if(ok) mostrarToast('Eliminado');
}

// ---------- Eventos ----------
var HOOKS = {
  formAtencion: function(f){ if(f==='empresaId') state.formAtencion.pacienteId = ''; },
  formEditar: function(f){ if(f==='empresaId') state.formEditar.pacienteId = ''; },
  filtros: function(){ state.limiteAtenciones = 200; }
};
function sembrarFormConfig(){
  var c = state.config;
  state.formConfig = { retencionPct: fmtNumeroCL(c.retencionPct), moneda: c.moneda || '$', valorUF: fmtNumeroCL(c.valorUF), emisor: c.emisor || '' };
}
function abrirEditorTarifa(id){
  var act = tarifaActual(id);
  state.editandoTarifaPsicologoId = id;
  state.formTarifaModo = act ? 'editar' : 'programar';
  state.formTarifa = act ? { tipo:act.tipo, tarifa:fmtNumeroCL(act.tarifa), vigenteDesde:hoyLocal() } : { tipo:'clp', tarifa:'', vigenteDesde:hoyLocal() };
}

root.addEventListener('click', function(e){
  var t = e.target.closest('[data-action]');
  if(!t || t.tagName === 'FORM' || t.tagName === 'INPUT' || t.tagName === 'SELECT') return;
  if(t.classList.contains('modal-overlay') && e.target.closest('.modal-box')) return;
  var a = t.dataset.action, id = t.dataset.id;
  switch(a){
    case 'salir': return onSalir();
    case 'set-tab':
      state.tab = t.dataset.tab; state.reporte = null;
      if(state.tab === 'config') sembrarFormConfig();
      return rerender();
    case 'cerrar-error': state.errorMsg = null; return rerender();
    case 'cancelar-confirm': state.confirmDialog = null; return rerender();
    case 'confirmar-eliminar': return onConfirmarEliminar();
    // liquidación / reportes
    case 'traer-uf': return onTraerUF();
    case 'exportar-resumen': return exportarResumen();
    case 'exportar-detalle-mes': return exportarDetalleMes();
    case 'ir-a-atenciones':
      state.filtros = { psicologoId:id, empresaId:'', paciente:'', mes:state.mes, desde:'', hasta:'' }; state.limiteAtenciones = 200; state.tab = 'atenciones'; return rerender();
    case 'abrir-reporte': state.reporte = { psicologoId:id }; window.scrollTo(0,0); return rerender();
    case 'cerrar-reporte': state.reporte = null; return rerender();
    case 'imprimir-reporte': return window.print();
    case 'csv-reporte': return csvReporte();
    // atenciones
    case 'editar-atencion':
      var at = porId(state.atenciones, id); if(!at) return;
      state.editandoAtencionId = id;
      state.formEditar = { fecha:at.fecha, hora:at.hora, psicologoId:at.psicologoId, empresaId:at.empresaId, pacienteId:at.pacienteId };
      return rerender();
    case 'cancelar-edicion': state.editandoAtencionId = null; return rerender();
    case 'eliminar-atencion': return pedirConfirmacion('atencion', id, '¿Eliminar esta atención? No se puede deshacer.');
    case 'mostrar-mas': state.limiteAtenciones += 200; return rerender();
    case 'limpiar-filtros': state.filtros = { psicologoId:'', empresaId:'', paciente:'', mes:'', desde:'', hasta:'' }; state.limiteAtenciones = 200; return rerender();
    case 'exportar-atenciones': return exportarAtenciones();
    // psicólogos
    case 'editar-psicologo':
      var p = psicoById(id); if(!p) return;
      state.editandoPsicologoId = id;
      state.formPsicologo = { nombre:p.nombre, profesion:p.profesion, rut:p.rut, telefono:p.telefono, banco:p.banco, tipoCuenta:p.tipoCuenta, numeroCuenta:p.numeroCuenta, email:p.email };
      return rerender();
    case 'cancelar-psicologo': state.editandoPsicologoId = null; return rerender();
    case 'abrir-editor-tarifa': abrirEditorTarifa(id); return rerender();
    case 'modo-editar-tarifa':
      var ae = tarifaActual(id); state.formTarifaModo = 'editar';
      state.formTarifa = ae ? { tipo:ae.tipo, tarifa:fmtNumeroCL(ae.tarifa), vigenteDesde:hoyLocal() } : { tipo:'clp', tarifa:'', vigenteDesde:hoyLocal() };
      return rerender();
    case 'modo-programar-tarifa':
      var ap = tarifaActual(id); state.formTarifaModo = 'programar';
      state.formTarifa = { tipo: ap ? ap.tipo : 'clp', tarifa:'', vigenteDesde:hoyLocal() };
      return rerender();
    case 'cancelar-tarifa': state.editandoTarifaPsicologoId = null; return rerender();
    case 'eliminar-tarifa': return pedirConfirmacion('tarifa', id, '¿Eliminar este registro de tarifa? Como la liquidación se calcula al momento de verla, puede cambiar el cálculo de meses pasados.');
    case 'eliminar-psicologo': return pedirConfirmacion('psicologo', id, '¿Eliminar este profesional y sus tarifas? Sus atenciones ya registradas se conservan.');
    // empresas / pacientes
    case 'editar-empresa': var em = empresaById(id); if(!em) return; state.editandoEmpresaId = id; state.formEmpresa = { nombre:em.nombre }; return rerender();
    case 'cancelar-empresa': state.editandoEmpresaId = null; return rerender();
    case 'eliminar-empresa': return pedirConfirmacion('empresa', id, '¿Eliminar esta empresa? Sus pacientes y atenciones ya registradas se conservan.');
    case 'editar-paciente': var pa = pacienteById(id); if(!pa) return; state.editandoPacienteId = id; state.formPaciente = { nombre:pa.nombre, empresaId:pa.empresaId }; return rerender();
    case 'cancelar-paciente': state.editandoPacienteId = null; return rerender();
    case 'eliminar-paciente': return pedirConfirmacion('paciente', id, '¿Eliminar este paciente? Las atenciones ya registradas se conservan.');
  }
});

root.addEventListener('submit', function(e){
  var t = e.target.closest('form[data-action]');
  if(!t) return;
  e.preventDefault();
  var a = t.dataset.action, id = t.dataset.id;
  switch(a){
    case 'login': return onLogin();
    case 'guardar-atencion': return onGuardarAtencion();
    case 'actualizar-atencion': return onActualizarAtencion(id);
    case 'agregar-psicologo': return onAgregarPsicologo();
    case 'guardar-psicologo': return onGuardarPsicologo(id);
    case 'guardar-edicion-tarifa': return onGuardarEdicionTarifa(id);
    case 'guardar-nueva-tarifa': return onGuardarNuevaTarifa(id);
    case 'agregar-empresa': return onAgregarEmpresa();
    case 'guardar-empresa': return onGuardarEmpresa(id);
    case 'agregar-paciente': return onAgregarPaciente();
    case 'guardar-paciente': return onGuardarPaciente(id);
    case 'guardar-config': return onGuardarConfig();
  }
});

root.addEventListener('input', function(e){
  var t = e.target.closest('[data-form]');
  if(!t) return;
  var form = t.dataset.form, field = t.dataset.field;
  if(form === 'login'){ state.login[field] = t.value; return; }
  if(!state[form]) return;
  state[form][field] = t.value;
  if(HOOKS[form]) HOOKS[form](field);
  rerender();
});

root.addEventListener('change', function(e){
  var t = e.target;
  var a = t.dataset && t.dataset.action;
  if(!a) return;
  switch(a){
    case 'set-mes': state.mes = t.value || mesActual(); return rerender();
    case 'quick-valor-uf': return onActualizarValorUF(t.value);
    case 'filtro-pacientes': state.pacientesFiltroEmpresaId = t.value; return rerender();
    case 'toggle-incluir-pacientes': state.incluirPacientes = t.checked; return rerender();
    case 'toggle-activo':
      return conError(async function(){
        await state.backend.actualizar(t.dataset.tabla, t.dataset.id, { activo: t.checked });
        await recargar(t.dataset.tabla);
      }, 'No se pudo actualizar');
  }
});

iniciar().catch(function(e){ console.error(e); state.authListo = true; mostrarError('Error al iniciar: ' + (e && e.message)); });
rerender();
})();
</script>
